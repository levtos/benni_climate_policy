name: Tests and static checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.11.17'
      - run: uv sync --locked --group dev
      - name: Full test suite
        run: uv run --locked pytest
      - name: Lint
        run: uv run --locked ruff check --select E9,F63,F7,F82 custom_components tests
      - name: Type check affected policy modules
        run: uv run --locked mypy --ignore-missing-imports --follow-imports=silent custom_components/benni_climate_policy/bathroom.py custom_components/benni_climate_policy/policy.py
      - run: git diff --check
